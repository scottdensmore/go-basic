name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache pinned BASIC corpus
        uses: actions/cache@v5
        with:
          path: .cache/basic-computer-games
          key: basic-computer-games-5301155192d91d74d337899cecc59dbda59c4c17

      - name: Run pinned corpus smoke tier
        run: make corpus-smoke

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test with race detector and coverage
        run: make coverage-check

      - name: Fuzz lexer and parser
        run: make fuzz

      - name: Build CLI and release archives
        run: |
          make build
          make release-check VERSION=ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Run govulncheck
        run: make vuln
