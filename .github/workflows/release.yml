name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-build-release:
    name: Verify, build, and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache pinned BASIC corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/basic-computer-games
          key: basic-computer-games-5301155192d91d74d337899cecc59dbda59c4c17

      - name: Run quality gate
        run: make check

      - name: Fuzz lexer and parser
        run: make fuzz

      - name: Run pinned corpus smoke tier
        run: make corpus-smoke

      - name: Scan dependencies for vulnerabilities
        run: make vuln

      - name: Build and verify release archives
        run: make release-check VERSION=${{ github.ref_name }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: dist/*
