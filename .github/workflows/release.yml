name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_name: go-basic-linux-amd64
          - goos: linux
            goarch: arm64
            asset_name: go-basic-linux-arm64
          - goos: windows
            goarch: amd64
            asset_name: go-basic-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            asset_name: go-basic-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset_name: go-basic-darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -v -o ${{ matrix.asset_name }} ./cmd/go-basic

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
